<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Il mio sito</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <img
            src="images/titolo.png"
            alt="Titolo del sito"
            class="titolo"
        >
    </header>

    <main class="contenitore">

        <div class="immagine-card sinistra">
            <img
                src="images/immagine1.png"
                alt="Immagine 1"
            >
        </div>

        <div class="immagine-card centro">
            <img
                src="images/immagine2.png"
                alt="Immagine 2"
            >
        </div>

        <div class="immagine-card destra">
            <img
                src="images/immagine3.png"
                alt="Immagine 3"
            >
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
